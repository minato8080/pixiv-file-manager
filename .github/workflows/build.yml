name: Build Tauri App (Windows)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "components/**"
      - "lib/**"
      - "styles/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "tailwind.config.ts"
      - "components.json"
      - "src-tauri/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          app=false
          while IFS= read -r path; do
            case "$path" in
              src/*|components/*|lib/*|styles/*|public/*|index.html|package.json|pnpm-lock.yaml|package-lock.json|vite.config.ts|tsconfig*.json|tailwind.config.ts|components.json|src-tauri/*|.github/workflows/*)
                app=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base" "${{ github.sha }}")

          echo "app=$app" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: src-tauri/target/release/bundle/
